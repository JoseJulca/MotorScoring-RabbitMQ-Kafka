spring:
  application:
    name: motor-scoring-crediticio
  profiles:
    default: mongodb
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 1000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${SERVER_PORT:8080}

motor-scoring:
  messaging:
    enabled: ${SCORING_MESSAGING_ENABLED:true}
  rabbitmq:
    exchange: ${SCORING_RABBITMQ_EXCHANGE:scoring.events}
    email-queue: ${SCORING_RABBITMQ_EMAIL_QUEUE:scoring.notificaciones.email}
    email-routing-key: ${SCORING_RABBITMQ_EMAIL_ROUTING_KEY:scoring.email}
  kafka:
    audit-topic: ${SCORING_KAFKA_AUDIT_TOPIC:scoring.evaluaciones.auditoria}
  audit:
    file: ${SCORING_AUDIT_FILE:./data/audit/auditoria-scoring.jsonl}
  notification:
    email:
      enabled: ${SCORING_EMAIL_ENABLED:false}
      to: ${SCORING_EMAIL_TO:demo@local.test}
      from: ${SCORING_EMAIL_FROM:motor-scoring@local.test}
